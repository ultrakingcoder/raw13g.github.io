<html manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <title>Rev3rseApex PS4 Host</title>
  <style>
    html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8; font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
    #wrap { padding:16px 18px; }
    #state { font-size:22px; font-weight:700; margin:0 0 6px; }
    #cache { font-size:12px; color:#5c6672; margin:0 10px; min-height:14px; }
    .ok { color:#7fd0a0; } 
    .bad { color:#d08a7f; }
    #brand { text-align:center; padding:8px 10px; background:#1b1e23; border-bottom:1px solid #1e2732; }
    #brand b { font-size:15px; font-weight:700; letter-spacing:.14em; color:#e6ebf2; vertical-align:middle; }
  </style>
</head>
<body>
  <div id="brand"><b>Rev3rseApex PS4</b></div>
  <div id="wrap">
    <div id="state">Initializing scripts...</div>
    <div id="cache">Cache Status: Loading...</div>
  </div>

  <script>
    // Application Cache status listener
    window.applicationCache.addEventListener('updateready', function() {
      window.applicationCache.swapCache();
      document.getElementById('cache').className = "ok";
      document.getElementById('cache').innerText = "Cache Status: Updated! Restart browser to apply.";
    }, false);

    window.applicationCache.addEventListener('noupdate', function() {
      document.getElementById('cache').className = "ok";
      document.getElementById('cache').innerText = "Cache Status: Up to date (Offline Ready).";
    }, false);

    window.applicationCache.addEventListener('error', function(e) {
      document.getElementById('cache').className = "bad";
      document.getElementById('cache').innerText = "Cache Status: Failed to load manifest.";
    }, false);
  </script>

  <!-- Required Exploit Scripts -->
  <script src="ps4_offsets.js"></script>
  <script src="mem.js"></script>
  <script src="int64.js"></script>
  <script src="jb.js"></script>
  <script src="core.js"></script>

  <script>
    // Update state once scripts have successfully parsed
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('state').innerText = "Scripts Loaded. Ready to run.";
      }, 500);
    });
  </script>
</body>
</html>
