<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS4 Custom Payload Host</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }
        h1 { color: #0070d1; }
        .btn {
            background-color: #0070d1;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background-color: #005bb5; }
        #status {
            margin-top: 30px;
            font-size: 18px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>PS4 Homebrew Host</h1>
    <p>Select your binary payload to load into local memory:</p>
    
    <button class="btn" onclick="loadPayload('goldhen.bin')">Load GoldHEN</button>
    <button class="btn" onclick="loadPayload('custom.bin')">Load Custom Bin</button>

    <div id="status">Status: Waiting for user action...</div>

    <script>
        function loadPayload(filename) {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "Status: Requesting " + filename + "...";

            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("HTTP error! File not found.");
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    statusDiv.innerText = "Status: Success! " + filename + " loaded (" + buffer.byteLength + " bytes).";
                    
                    // Note: To execute this buffer on your specific target environment, 
                    // pass the ArrayBuffer into your ROP chain / kernel execution vector.
                    console.log("Payload buffer ready:", buffer);
                })
                .catch(error => {
                    statusDiv.innerText = "Status: Failed to load " + filename + " (" + error.message + ")";
                });
        }
    </script>

</body>
</html>
