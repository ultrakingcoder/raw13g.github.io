name: Build PS4 HEN Payload

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip xxd

      - name: Install PS4 Payload SDK
        run: |
          sudo git clone https://github.com/Scene-Collective/ps4-payload-sdk.git /lib/ps4-payload-sdk
          echo "PS4SDK=/lib/ps4-payload-sdk" >> $GITHUB_ENV

      - name: Build Payload
        run: |
          bash build.sh

      - name: Rename and Prepare Payload
        run: |
          cp hen.bin Rev3rseApex.bin

      - name: Upload Compiled Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rev3rseapex-bin
          path: Rev3rseApex.bin
