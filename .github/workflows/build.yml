name: Build and Publish PS4 Payload

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git curl unzip xxd

      - name: Install and Build PS4 Payload SDK
        run: |
          curl -fL -o /tmp/sdk.zip https://github.com/Scene-Collective/ps4-payload-sdk/archive/refs/heads/main.zip
          mkdir -p /tmp/ps4-sdk
          unzip -q /tmp/sdk.zip -d /tmp/
          mv /tmp/ps4-payload-sdk-*/* /tmp/ps4-sdk/
          cd /tmp/ps4-sdk/libPS4
          make
          echo "PS4SDK=/tmp/ps4-sdk" >> $GITHUB_ENV

      - name: Build Payload
        env:
          PS4SDK: /tmp/ps4-sdk
        run: |
          set -e

          # Download base ps4-hen template if needed
          if [ ! -d "kpayload" ]; then
              curl -fL -o main.zip https://github.com/Scene-Collective/ps4-hen/archive/refs/heads/main.zip
              unzip -o main.zip
              cp -r ps4-hen-main/. .
              rm -rf ps4-hen-main main.zip
          fi

          # 1. Build kpayload first
          cd kpayload
          make clean || true
          make
          cd ..

          # 2. Download and process plugins into installer/source
          mkdir -p tmp installer/source
          cd tmp
          curl -fLJO https://github.com/Scene-Collective/ps4-hen-plugins/releases/latest/download/plugins.zip || true
          unzip -o plugins.zip || true
          
          for file in *.prx; do
              if [ -f "$file" ]; then
                  echo "${file}"
                  xxd -i "$file" | sed 's/^unsigned /static const unsigned /' > "../installer/source/${file}.inc.c"
              fi
          done
          cd ..
          rm -rf tmp

          # 3. Handle configuration
          if [ -f "hen.ini" ]; then
              xxd -i "hen.ini" | sed 's/^unsigned /static const unsigned /' > "installer/source/hen.ini.inc.c"
          else
              printf "static const unsigned char hen_ini[] = {};\nstatic unsigned int hen_ini_len = 0;\n" > "installer/source/hen.ini.inc.c"
          fi

          # 4. Build installer
          cd installer
          make clean || true
          make
          cd ..

          # 5. Output final binary to root directory
          cp installer/installer.bin Rev3rseApex.bin
          echo "Build completed successfully!"

      - name: Commit and Push Payload to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add -f Rev3rseApex.bin
          git diff --staged --quiet || git commit -m "Auto-update Rev3rseApex.bin payload [skip ci]"
          git push origin main || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Compiled Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rev3rseApex.bin
          path: Rev3rseApex.bin
