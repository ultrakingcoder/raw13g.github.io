# language: YAML, file: .github/workflows/build.yml, target: GitHub Actions CI
name: Build Custom HEN Payload

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang llvm

    - name: Compile Binary Payload
      run: |
        make clean
        make

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-payload-bin
        path: custom_hen.bin
