# language: YAML, file: .github/workflows/build.yml, target: GitHub Actions CI
name: Build and Commit Custom HEN

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang llvm

    - name: Compile Binary Payload
      run: |
        make clean
        make

    - name: Commit Compiled Binary to Repo
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add custom_hen.bin
        git commit -m "Auto-compile custom_hen.bin [skip ci]" || echo "No changes to commit"
        git push
