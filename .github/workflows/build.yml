name: Build PS4 Payload

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git curl unzip xxd

      - name: Install PS4 Payload SDK
        run: |
          git clone https://github.com/ps4dev/ps4-payload-sdk.git /tmp/ps4-sdk
          echo "PS4_PAYLOAD_SDK=/tmp/ps4-sdk" >> $GITHUB_ENV

      - name: Build Payload
        run: |
          sed -i 's/\r$//' build.sh
          bash build.sh

      - name: Upload Compiled Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rev3rseApex.bin
          path: Rev3rseApex.bin
