name: Build PS4 Payload

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git curl unzip xxd

      - name: Install PS4 Payload SDK
        run: |
          curl -fL -o /tmp/sdk.zip https://github.com/Scene-Collective/ps4-payload-sdk/archive/refs/heads/main.zip
          mkdir -p /tmp/ps4-sdk
          unzip -q /tmp/sdk.zip -d /tmp/
          mv /tmp/ps4-payload-sdk-*/* /tmp/ps4-sdk/
          echo "PS4SDK=/tmp/ps4-sdk" >> $GITHUB_ENV

      - name: Build Payload
        env:
          PS4SDK: /tmp/ps4-sdk
        run: |
          # Download base template if needed
          if [ ! -d "kpayload" ]; then
              curl -fL -o main.zip https://github.com/Scene-Collective/ps4-hen/archive/refs/heads/main.zip
              unzip -o main.zip
              cp -r ps4-hen-main/. .
              rm -rf ps4-hen-main main.zip
          fi

          # Prepare directories for both kpayload and installer sources
          mkdir -p kpayload/source installer/source plugins

          # Download and extract plugins
          curl -fL -o plugins.zip https://github.com/Scene-Collective/ps4-hen-plugins/releases/latest/download/plugins.zip
          unzip -q plugins.zip -d plugins/ || true
          find . -maxdepth 2 -name "*.prx" -exec cp -n {} plugins/ \;

          # Convert plugins to C includes for BOTH kpayload and installer
          for file in plugins/*.prx; do
              if [ -f "$file" ]; then
                  inc_name="$(basename "$file" .prx)_prx.inc.c"
                  xxd -i "$file" | sed 's/^unsigned /static const unsigned /' > "kpayload/source/$inc_name"
                  xxd -i "$file" | sed 's/^unsigned /static const unsigned /' > "installer/source/$inc_name"
              fi
          done

          # Handle configuration for BOTH
          if [ -f "hen.ini" ]; then
              xxd -i "hen.ini" | sed 's/^unsigned /static const unsigned /' > "kpayload/source/hen.ini.inc.c"
              xxd -i "hen.ini" | sed 's/^unsigned /static const unsigned /' > "installer/source/hen.ini.inc.c"
          else
              printf "static const unsigned char hen_ini[] = {};\nstatic unsigned int hen_ini_len = 0;\n" > "kpayload/source/hen.ini.inc.c"
              printf "static const unsigned char hen_ini[] = {};\nstatic unsigned int hen_ini_len = 0;\n" > "installer/source/hen.ini.inc.c"
          fi

          # Build kpayload
          cd kpayload
          make clean || true
          make
          cd ..

          # Build installer
          cd installer
          make clean || true
          make
          cd ..

          # Output final binary
          cp installer/installer.bin Rev3rseApex.bin
          echo "Build completed successfully!"

      - name: Upload Compiled Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rev3rseApex.bin
          path: Rev3rseApex.bin
